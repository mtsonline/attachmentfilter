[workspace]
resolver = "2"
members = ["core", "milter", "agent"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mtsonline/attachmentfilter"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
